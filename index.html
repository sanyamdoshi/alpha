<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
           background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:48px 16px; }
    .wrap { width:100%; max-width:860px; }
    h1 { font-size:2.5rem; margin:0 0 6px; }
    .sub { color:var(--muted); margin:0 0 32px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
    a.card { display:block; padding:20px; border-radius:14px; background:var(--card);
             border:1px solid var(--border); color:inherit; text-decoration:none;
             transition:transform .15s, border-color .15s; }
    a.card:hover { transform:translateY(-3px); border-color:var(--accent); }
    .icon { font-size:1.8rem; }
    .title { font-weight:600; font-size:1.1rem; margin:10px 0 4px; }
    .desc { color:var(--muted); font-size:.92rem; line-height:1.4; }
    .url { color:var(--accent); font-size:.8rem; margin-top:12px; word-break:break-all; }
    footer { color:var(--muted); font-size:.8rem; margin-top:40px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Alpha</h1>
    <p class="sub">Developer tools &amp; test environments</p>
    <div class="grid" id="links"></div>
    <footer>alpha.is-not-a.dev</footer>
  </div>

  <script>
    // ===== Add, remove or edit links here =====
    const links = [
      { icon: "📥", title: "Mail Trap",  desc: "Catches all Salesforce sandbox emails (Mailpit).", url: "https://trap.alpha.is-not-a.dev:8025" },
      { icon: "✉️", title: "Webmail",    desc: "Read & reply as test contacts @inbox.alpha.is-not-a.dev.", url: "https://mail.alpha.is-not-a.dev" },
      { icon: "💻", title: "GitHub Repo", desc: "Source of this page.", url: "https://github.com/sanyamdoshi/alpha" }
    ];
    // ==========================================

    document.getElementById("links").innerHTML = links.map(l => `
      <a class="card" href="${l.url}" target="_blank" rel="noopener">
        <div class="icon">${l.icon}</div>
        <div class="title">${l.title}</div>
        <div class="desc">${l.desc}</div>
        <div class="url">${l.url.replace("https://", "")}</div>
      </a>`).join("");
  </script>
</body>
</html>
